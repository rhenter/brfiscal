[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brfiscal"
requires-python = ">=3.10"
dynamic = [
    "authors",
    "classifiers",
    "dependencies",
    "description",
    "keywords",
    "license",
    "readme",
    "scripts",
    "urls",
    "version",
]

[project.optional-dependencies]
django = ["Django>=4.2"]

[dependency-groups]
dev = [
    "build",
    "Django>=4.2",
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "setuptools>=77",
    "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
DJANGO_SETTINGS_MODULE = "tests.django_settings"
django_find_project = false
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
